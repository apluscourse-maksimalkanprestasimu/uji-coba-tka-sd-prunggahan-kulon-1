name: Deploy TKA app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p site
          base64 -d source/app.zip.b64 > /tmp/app.zip
          unzip -o /tmp/app.zip -d /tmp/tka-app
          cp /tmp/tka-app/*.html site/index.html
          cp source/supabase-integration.js site/supabase-integration.js
          python - <<'PY'
          from pathlib import Path
          p = Path("site/index.html")
          html = p.read_text(encoding="utf-8")
          html = html.replace("</body>", '<script src="./supabase-integration.js"></script>\\n</body>')
          p.write_text(html, encoding="utf-8")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
